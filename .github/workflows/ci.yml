name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_agent_test?schema=chat
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-real
      # CI runs against Gemini only, per CLAUDE.md principle 7 — no live
      # Anthropic/OpenAI credentials required for routine CI.
      DEFAULT_AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.CI_GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @chat-agent/db run generate

      - name: Bootstrap chat schema for tests
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS chat;" || true
        env:
          PGPASSWORD: postgres

      - run: pnpm --filter @chat-agent/db exec prisma migrate deploy

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

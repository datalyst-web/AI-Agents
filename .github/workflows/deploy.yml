name: Deploy chat-api / chat-workers

# Per-service deploy onto the SHARED agents-platform ECS cluster (see
# infra/README.md) — this workflow never touches Voice's or Sales'
# services, only the chat-api / chat-workers ECS services and ECR repos
# this product owns.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: agents-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-api, chat-workers]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push ${{ matrix.service }}
        run: |
          dockerfile="apps/${{ matrix.service == 'chat-api' && 'api' || 'workers' }}/Dockerfile"
          repo="${{ steps.ecr.outputs.registry }}/${{ matrix.service }}"
          docker build -f "$dockerfile" -t "$repo:${{ steps.tag.outputs.tag }}" -t "$repo:latest" .
          docker push "$repo:${{ steps.tag.outputs.tag }}"
          docker push "$repo:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment (picks up :latest via new task def revision managed by Terraform)
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service chat-api --force-new-deployment
          aws ecs update-service --cluster "$ECS_CLUSTER" --service chat-workers --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services chat-api chat-workers

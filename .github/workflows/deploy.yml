name: Deploy api / workers (Railway)

# Real deploy target for this project: Railway services `api` and
# `workers` in the `chat-agent-platform` project (see the memory doc /
# session history — this replaced an earlier AWS ECS plan that was never
# actually stood up). Runs only after CI has passed on main, via
# workflow_run — never deploy on a red build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering commit by default
          # — without this, a push landing on main between CI finishing and
          # this job starting would deploy an untested commit instead of
          # the one CI actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `railway up` builds from each service's own Dockerfile (RAILWAY_DOCKERFILE_PATH
      # is set per-service in the Railway project, not here) and deploys —
      # the exact same command this project's deploys have used manually.
      - name: Deploy api
        run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy workers
        run: railway up --service workers --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

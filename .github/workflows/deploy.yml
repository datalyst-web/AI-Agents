name: Deploy api / workers (Railway)

# Real deploy target for this project: Railway services `api` and
# `workers` in the `chat-agent-platform` project (see the memory doc /
# session history — this replaced an earlier AWS ECS plan that was never
# actually stood up). Runs only after CI has passed on main, via
# workflow_run — never deploy on a red build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering commit by default
          # — without this, a push landing on main between CI finishing and
          # this job starting would deploy an untested commit instead of
          # the one CI actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Production schema is NOT applied anywhere else. CI only pushes the
      # schema to its own ephemeral Postgres, so without this step a deploy
      # ships a Prisma client selecting columns production doesn't have,
      # and every query touching that model 500s — this took login down on
      # 2026-09-10 (users.notify_escalation_email).
      #
      # Runs BEFORE the services deploy, so the schema is always ahead of
      # the code that depends on it, never behind.
      #
      # The app's own DATABASE_URL is a least-privilege role with no DDL
      # rights (correct, and staying that way), so this needs the database
      # owner's URL in DATABASE_MIGRATE_URL — set as a Railway variable on
      # the `api` service, which `railway run` injects here. Skips cleanly
      # when it isn't set rather than failing the deploy.
      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile

      # psql (not `prisma db execute`) for the two SQL files, matching what
      # ci.yml already does — rls_policies.sql is a DO $$ block, and psql is
      # the client it's known to run correctly under. It's preinstalled on
      # ubuntu-latest.
      - name: Apply schema + RLS policies to production
        run: |
          railway run --service api -- bash -euo pipefail -c '
            if [ -z "${DATABASE_MIGRATE_URL:-}" ]; then
              echo "DATABASE_MIGRATE_URL not set — skipping schema apply."
              exit 0
            fi
            echo "--- schema changes to be applied ---"
            DATABASE_URL="$DATABASE_MIGRATE_URL" \
              pnpm --filter @chat-agent/db exec prisma migrate diff \
                --from-schema-datasource packages/db/prisma/schema.prisma \
                --to-schema-datamodel packages/db/prisma/schema.prisma
            # No --accept-data-loss: an additive change applies cleanly, and
            # anything destructive fails the deploy rather than silently
            # dropping a production column.
            DATABASE_URL="$DATABASE_MIGRATE_URL" \
              pnpm --filter @chat-agent/db exec prisma db push --skip-generate
            # db push creates tables but knows nothing about row-level
            # security, so a newly added tenant-scoped table has NO tenant
            # isolation until this re-runs. Both files are idempotent.
            psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -f packages/db/prisma/sql/rls_policies.sql
            psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -f packages/db/prisma/sql/vector_index.sql
          '
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 15de703e-d006-43d8-837f-10b800abb87e

      # `railway up` builds from each service's own Dockerfile (RAILWAY_DOCKERFILE_PATH
      # is set per-service in the Railway project, not here) and deploys —
      # the exact same command this project's deploys have used manually.
      #
      # RAILWAY_API_TOKEN (not RAILWAY_TOKEN) — the current Railway dashboard
      # only issues account/workspace-scoped tokens (Account Settings > Tokens),
      # not the older project-scoped token RAILWAY_TOKEN expects on its own.
      # An account token needs RAILWAY_PROJECT_ID alongside it so the CLI
      # knows which project's `api`/`workers` services to target — without
      # it, `railway up` has no way to disambiguate across every project the
      # token's workspace can see, and rejects the token outright. It also
      # can't infer the environment from an account token, hence
      # --environment production (the only environment this project has).
      - name: Deploy api
        run: railway up --service api --environment production --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 15de703e-d006-43d8-837f-10b800abb87e

      - name: Deploy workers
        run: railway up --service workers --environment production --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 15de703e-d006-43d8-837f-10b800abb87e

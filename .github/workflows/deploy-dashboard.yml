name: Deploy dashboard

# Real deploy target: the Railway service `dashboard` in the same project as
# api/workers, served at app.datalystafrica.com. It builds from
# apps/dashboard/Dockerfile (RAILWAY_DOCKERFILE_PATH is set on the service),
# and the four NEXT_PUBLIC_* values are Railway service variables, passed to
# the Dockerfile as build args. widget.js isn't a separate deploy: the
# dashboard build rebuilds apps/widget and copies it into public/widget.js.
#
# This replaced Vercel on 2026-09-21 — Vercel's free plan doesn't allow
# commercial use, and moving here keeps all hosting on one bill.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering commit by default
          # — without this, a push landing on main between CI finishing and
          # this job starting would deploy an untested commit instead of
          # the one CI actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # Same account-scoped token and project/environment flags as deploy.yml
      # (see the comment there for why both are required).
      - name: Deploy dashboard to Railway
        run: railway up --service dashboard --environment production --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 15de703e-d006-43d8-837f-10b800abb87e

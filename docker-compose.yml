# Local dev only — mirrors the shared platform's Aurora Postgres (pgvector)
# + ElastiCache Redis with throwaway single-node equivalents. Production
# never uses this file; see infra/terraform for the real shared platform.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_agent
    ports:
      - "5432:5432"
    volumes:
      - chat_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chat_agent_redis:/data

volumes:
  chat_agent_postgres:
  chat_agent_redis:
